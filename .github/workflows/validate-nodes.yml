name: Validate nodes (cloud fallback)

on:
  schedule:
    - cron: '17 10 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      smoke_only:
        description: 'Only verify cloud dependencies'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-node-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether local run already succeeded
        id: gate
        shell: bash
        run: |
          day=$(TZ=Asia/Shanghai date +%F)
          if [ -f last-validation.json ] && python -c 'import json,sys; d=json.load(open("last-validation.json")); sys.exit(not (d.get("date_cst") == sys.argv[1] and d.get("count") == 50))' "$day"; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true' || inputs.smoke_only == true
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        if: steps.gate.outputs.run == 'true' || inputs.smoke_only == true
        shell: bash
        run: |
          python -m pip install requests PyYAML
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v1.19.31.gz \
            -o "$RUNNER_TEMP/mihomo.gz"
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          "$RUNNER_TEMP/mihomo" -v
          python -m py_compile validate_nodes.py publish_validated_nodes.py

      - name: Validate nodes and push update
        if: steps.gate.outputs.run == 'true' && inputs.smoke_only != true
        shell: bash
        env:
          MIHOMO_BIN: ${{ runner.temp }}/mihomo
          VALIDATION_SOURCE: cloud
        run: |
          python validate_nodes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python publish_validated_nodes.py
